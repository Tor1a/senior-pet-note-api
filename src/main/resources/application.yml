# 시니어펫 노트 백엔드 설정. 비밀값은 환경변수로만 받는다(README.md "환경변수").
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    # 한도를 넘긴 업로드도 본문을 끝까지 읽어 413 JSON 으로 응답하게 한다(기본 2MB 면 연결이 끊길 수 있다)
    max-swallow-size: 20MB

spring:
  application:
    name: senior-pet-backend
  task:
    scheduling:
      shutdown:
        # 종료 시 진행 중인 발송 작업이 끝나길 기다린다
        await-termination: true
        await-termination-period: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seniorpet}
    username: ${DB_USERNAME:seniorpet}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 만 바꾼다. Hibernate 는 엔티티와 테이블이 맞는지 검사만 한다.
      ddl-auto: validate
  servlet:
    multipart:
      # 사진 업로드 한도. PetPhotoService.MAX_BYTES(5MB)와 같은 값. 넘으면 413 FILE_TOO_LARGE
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    # JVM 이 항상 UTC 이므로 명시만 해 둔다
    time-zone: UTC

app:
  # 서비스 기준 시간대(기록 날짜 새벽 4시 규칙·알림 발송 시각·지난 기록 기간 계산). 틀린 값이면 서버가 시작되지 않는다.
  # JVM 시간대(항상 UTC, SeniorPetApplication.main)와는 별개다. README.md "시간대"
  zone: ${APP_ZONE:Asia/Seoul}
  jwt:
    # HS256 서명 키. 32바이트 이상 필수(짧거나 비어 있으면 서버가 시작되지 않는다).
    secret: ${JWT_SECRET:}
    # 토큰 유효기간. MVP 는 refresh 토큰 없이 7일.
    expiration: ${JWT_EXPIRATION:7d}
  cors:
    # 쉼표로 여러 개 지정. 기본값 = 웹 개발 서버(5173) + vite preview(4173)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  photo:
    # 사진 저장 폴더(로컬 디스크). 경로 규칙 <user_id>/<랜덤파일명>.<확장자>. 커밋 금지(.gitignore 의 data/)
    dir: ${PHOTO_DIR:./data/photos}
  push:
    fcm:
      # true 면 실제 FCM 으로 발송, false(기본)면 로그 발송기(실제 발송 없음). README.md "환경변수"
      enabled: ${FCM_ENABLED:false}
      # 서비스 계정 JSON 을 base64 로 인코딩한 값. 환경변수로만 받는다(파일·저장소 커밋 금지).
      # FCM_ENABLED=true 인데 비었거나 해석할 수 없으면 서버가 시작되지 않는다.
      credentials-base64: ${FCM_CREDENTIALS_BASE64:}
  reminder:
    # 1분 주기 투약 알림 발송 스케줄러 on/off. 테스트 프로필은 false
    scheduler-enabled: ${REMINDER_SCHEDULER_ENABLED:true}
    # 발송 시각이 지난 회차를 늦게라도 보내는 최대 지연(서버 재시작·지연 대비). 그보다 오래된 회차는 버린다
    catch-up: PT10M
