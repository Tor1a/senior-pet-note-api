// 시니어펫 노트 백엔드 (Spring Boot 3.x, Java 21)
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.oraegyeot'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
    firebaseAdminVersion = '9.11.0'
    // firebase-admin 의 FCM 전송(ApacheHttp2Transport)이 요구하는 버전. Spring Boot 관리 버전(5.5)으로 내려가지 않게 고정한다.
    // 이 프로젝트에서 httpclient5 를 쓰는 곳은 firebase-admin 뿐이다(./gradlew dependencies 로 확인).
    // netty 는 Spring Boot 관리 버전(4.1.127)으로 내려가 쓴다(firebase-admin 이 요구하는 4.2.x 가 아님). 현재 FCM 전송 경로는 httpclient5 라 영향 없음.
    set('httpclient5.version', '5.6.4')
    set('httpcore5.version', '5.4.3')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // JWT (HS256)
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // FCM 푸시 발송(투약 알림). 메시징만 쓰므로 Firestore·Cloud Storage 클라이언트(grpc 등 대형 전이 의존성)는 뺀다
    implementation("com.google.firebase:firebase-admin:${firebaseAdminVersion}") {
        exclude group: 'com.google.cloud', module: 'google-cloud-firestore'
        exclude group: 'com.google.cloud', module: 'google-cloud-storage'
    }
    // FirebaseOptions 가 기본 JSON 파서로 쓰는데 위에서 뺀 Storage·Firestore 를 통해서만 들어오므로 직접 넣는다.
    // 버전은 firebase-admin 이 쓰는 google-http-client(2.2.0)와 맞춘다.
    implementation 'com.google.http-client:google-http-client-jackson2:2.2.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// 실행 가능한 jar(bootJar) 하나만 만든다
tasks.named('jar') {
    enabled = false
}
